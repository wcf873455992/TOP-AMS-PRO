<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TOP AMS Pro</title>
    <style>
        body { font-family: -apple-system, Arial; max-width: 520px; margin: 20px auto; padding: 16px; }
        h3 { margin-top: 24px; }
        h3:first-child { margin-top: 0; }
        .btn { width: 100%; padding: 14px; background: #007bff; color: #fff;
               border: none; border-radius: 6px; font-size: 16px; cursor: pointer;
               display: block; text-decoration: none; text-align: center;
               margin: 8px 0; box-sizing: border-box; }
        .btn.printer { background: #28a745; }
        .status-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
        .status-item { background: #f7f7f7; padding: 6px 4px; border-radius: 4px; text-align: center; }
        .status-item .label { color: #888; font-size: 11px; }
        .status-item .value { font-size: 14px; font-weight: bold; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .on  { background: #d4edda; color: #155724; }
        .off { background: #f8d7da; color: #721c24; }
        .loading { padding: 12px; color: #999; }
        .wifi-info { padding: 10px; background: #eef4ff; border-radius: 6px;
                     font-size: 14px; color: #335; margin-bottom: 8px; }
        .task-name { font-size: 15px; color: #333; margin-bottom: 8px;
                     padding: 8px 10px; background: #f0f6ff; border-radius: 4px; }
        .channel-header { display: flex; align-items: center; justify-content: space-between;
                          margin-top: 24px; margin-bottom: 8px; }
        .channel-header h3 { margin: 0; }
        .mode-btn { padding: 8px 20px; font-size: 14px; font-weight: bold;
                    border: none; border-radius: 6px; cursor: pointer;
                    color: #fff; background: #6c757d; }
        .mode-btn.active { background: #dc3545; }
        .mode-hint { font-size: 12px; color: #dc3545; margin-left: 8px; }
        .slow-feed-row { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 8px; }
        .slow-feed-row label { color: #555; }
        .slow-feed-row input { padding: 4px 6px; font-size: 13px; border-radius: 4px; border: 1px solid #ddd; }
        .slow-feed-row2 { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 13px; margin-bottom: 8px; }
        .slow-feed-row2 label { color: #555; }
        .slow-feed-row2 input { padding: 4px 6px; font-size: 13px; border-radius: 4px; border: 1px solid #ddd; }
        .slow-feed-row2 .buffer-toggle { display: inline-flex; align-items: center; gap: 4px; }
        .slow-feed-row2 .buffer-toggle input { width: auto; margin: 0; }
        .slow-feed-row2 button { padding: 4px 10px; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .slow-feed-row button { padding: 4px 10px; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .channel { border: 1px solid #ddd; border-radius: 8px; padding: 8px 10px;
                   margin-bottom: 8px; }
        .channel.active { border-color: #28a745; background: #f0fff4; }
        .ch-row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
                   margin-bottom: 6px; }
        .ch-title { font-size: 14px; font-weight: bold; white-space: nowrap; }
        .channel-enable { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #555; }
        .channel-enable input { margin: 0; }
        .ch-current { font-size: 16px; color: #28a745; font-weight: bold;
                      white-space: nowrap; margin-left: auto; }
        .ch-state { font-size: 14px; color: #007bff; font-weight: bold;
                    white-space: nowrap; margin-left: auto; }
        .mat-select { padding: 4px 6px; font-size: 13px; border-radius: 4px;
                      border: 1px solid #ddd; box-sizing: border-box; min-width: 80px; }
        .mat-select:disabled { background: #f0f0f0; color: #aaa; }
        .color-picker { width: 24px; height: 24px; border-radius: 50%;
                        border: 2px solid #ddd; cursor: pointer;
                        display: inline-block; vertical-align: middle; }
        .time-label { font-size: 12px; color: #888; white-space: nowrap; }
        .time-input { width: 70px; padding: 4px 6px; font-size: 13px;
                      border-radius: 4px; border: 1px solid #ddd; box-sizing: border-box; }
        .time-input:disabled { background: #f0f0f0; color: #aaa; }
        .ch-row2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .ch-btn { padding: 8px; color: #fff; border: none; border-radius: 4px;
                  font-size: 14px; cursor: pointer; }
        .ch-btn.forward { background: #17a2b8; }
        .ch-btn.backward { background: #ffc107; color: #333; }
        .ch-btn.load { background: #28a745; }
        .ch-btn:active { opacity: 0.7; }
        .ch-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .rev-btn { padding: 4px 10px; font-size: 13px; border-radius: 4px;
                   border: 1px solid #ddd; background: #f7f7f7; cursor: pointer;
                   white-space: nowrap; }
        .rev-btn.reversed { background: #ffeeba; border-color: #ffc107; }
        .rev-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
                 background:#333; color:#fff; padding:10px 20px; border-radius:6px;
                 font-size:14px; opacity:0; transition:opacity 0.3s; pointer-events:none; }
        .toast.show { opacity:0.9; }
        .log-panel { background:#1e1e1e; color:#d4d4d4; font-family:monospace;
                     font-size:12px; padding:10px; border-radius:6px;
                     height:300px; overflow-y:auto; white-space:pre-wrap;
                     line-height:1.4; margin-top:8px; }
        .clear-btn { margin-top:8px; padding:8px 16px; background:#6c757d;
                     color:#fff; border:none; border-radius:4px; cursor:pointer; }
    </style>
</head>
<body>
    <h1 style="text-align:center; color:#007bff; margin-top:0;">TOP AMS Pro</h1>

    <h3>WiFi 配置</h3>
    <div id="wifi-info" class="wifi-info">当前 WiFi: --</div>
    <a href="/wifi" class="btn">配置 WiFi</a>

    <h3 style="display:none;">拓竹打印机</h3>
        <a href="/printer" class="btn printer">配置打印机</a>

    <h3 style="display:none;">打印机状态</h3>
    <div id="status"><div class="loading">等待 MQTT 连接...</div></div>

    <div class="channel-header">
        <h3>耗材通道</h3>
        <div>
            <button id="modeBtn" class="mode-btn" onclick="toggleMode()">被动模式</button>
            <span id="modeHint" class="mode-hint"></span>
        </div>
    </div>
    <div class="slow-feed-row">
        <label>送料超时</label>
        <input type="number" id="feedTimeout" placeholder="秒" title="全速进料超时（秒）" style="width:60px;">
        <span style="font-size:12px;color:#888;">秒</span>
        <label style="margin-left:12px;">缓慢进料</label>
        <input type="number" id="slowPulse" placeholder="脉冲" title="脉冲宽度(ms)，改动即生效" style="width:60px;" oninput="scheduleSlowFeedSave()">
        <input type="number" id="slowGap" placeholder="间隔" title="间隔(ms)，改动即生效" style="width:60px;" oninput="scheduleSlowFeedSave()">
        <button onclick="testSlowFeed()">测试</button>
    </div>
<div class="slow-feed-row2">
    <label title="微动开关电平有效时持续缓慢送料，无效立即停止">微动辅助送料</label>
    <span>GPIO7</span>
    <label class="buffer-toggle"><input type="checkbox" id="bufEnabled" onchange="saveBuffer()"><span id="bufEnabledText">关闭</span></label>
    <button id="bufPolarity" type="button" onclick="toggleBufferPolarity()">切换为高有效</button>
    <span id="bufStatus" title="电平有效时持续缓慢送料，无效立即停止（改动即生效，无需保存）" style="font-size:12px;color:#888;">--</span>
    </div>
    <div class="slow-feed-row2">
        <label>料动编码器</label>
        <input type="number" id="bufEncoderA" placeholder="A GPIO" title="编码器 A 相 GPIO；禁用时留空；改动即生效" style="width:58px;" onchange="saveBuffer()">
        <input type="number" id="bufEncoderB" placeholder="B GPIO" title="编码器 B 相 GPIO；禁用时留空；改动即生效" style="width:58px;" onchange="saveBuffer()">
        <label><input type="checkbox" id="bufEncoderReverse" style="width:auto;" onchange="saveBuffer()">反向</label>
    </div>
    <div id="channels"><div class="loading">加载中...</div></div>
<h3>设备日志</h3>
    <div id="logPanel" class="log-panel"></div>
    <div style="display: flex; gap: 8px; margin-top: 8px;">
        <button class="clear-btn" onclick="clearLogs()">清空显示</button>
        <button class="clear-btn" onclick="saveLogs()" style="background: #28a745;">另存为</button>
        <button class="clear-btn" onclick="rebootDevice()" style="background: #dc3545;">重启</button>
    </div>

    <div id="toast" class="toast"></div>

    <!-- 颜色选择弹窗 -->
    <div id="colorModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
                                background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:#fff; border-radius:8px; padding:16px; width:320px; max-width:90%;">
            <h3 style="margin-top:0;">选择颜色</h3>
            <div id="presetColors" style="display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin-bottom:12px;"></div>
            <div style="margin-bottom:12px;">
                <label style="font-size:13px; color:#666;">自定义</label>
                <input type="color" id="customColor" style="width:100%; height:40px; margin-top:4px;">
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <button onclick="closeColorPicker()" style="padding:10px; background:#6c757d; color:#fff;
                                                               border:none; border-radius:4px; cursor:pointer;">取消</button>
                <button onclick="confirmColor()" style="padding:10px; background:#007bff; color:#fff;
                                                         border:none; border-radius:4px; cursor:pointer;">确定</button>
            </div>
        </div>
    </div>

    <script>
        let actionPending = false;
        let actionPendingTime = 0;
        let userInteracting = false;
        let logSince = 0;
        let logReceived = 0;
        let currentColorCh = 0;
        let currentMode = 'passive';
        let ftTimer = null;
        let slowFeedSaveTimer = null;
        let bufTouchedAt = 0;   /* 最近一次操作微动辅助送料的时刻（3 秒内不回同步，避免打断输入） */
        let bufferActiveHigh = false;

        const MATERIALS = ['PLA', 'PETG', 'ABS', 'TPU', 'ASA', 'PC', 'PA', 'PVA', 'HIPS'];
        const PRESET_COLORS = [
            '#ffffff', '#000000', '#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff',
            '#ff8000', '#80ff00', '#00ff80', '#0080ff', '#8000ff', '#ff0080', '#808080', '#c0c0c0',
            '#800000', '#008000', '#000080', '#808000', '#800080', '#008080', '#ffcccc', '#ccffcc',
            '#ccccff', '#ffffcc', '#ffccff', '#ccffff', '#ffd700', '#ffa500', '#a52a2a', '#2f4f4f'
        ];

        let channelsData = [];
        let slowFeedLoaded = false;
        let currentCh = 0;

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function loadSavedConfig() {
            fetch('/config', { cache: 'no-store' })
                .then(r => r.json())
                .then(cfg => {
                    if (cfg.has_wifi && cfg.wifi_ssid) {
                        document.getElementById('wifi-info').textContent = '当前 WiFi: ' + cfg.wifi_ssid;
                    } else {
                        document.getElementById('wifi-info').textContent = '当前 WiFi: 未配置';
                    }
                })
                .catch(() => {});
        }

        function formatTime(ts) {
            if (!ts || ts <= 0) return '--';
            const d = new Date(ts * 1000);
            const pad = n => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
                   pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
        }

        function refreshStatus() {
            fetch('/bambu/status', { cache: 'no-store' })
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(s => {
                    window._lastStatus = s;
                    const el = document.getElementById('status');

                    try {
                        const badge = s.connected
                            ? '<span class="badge on">已连接</span>'
                            : '<span class="badge off">未连接</span>';

                        let filaText = '未知', filaClass = 'off';
                        if (s.hw_switch === 3) { filaText = '有料'; filaClass = 'on'; }
                        else if (s.hw_switch === 2) { filaText = '无料'; filaClass = 'off'; }

                        let amsText = '';
                        if (s.ams_status === 768) amsText = '冲刷完成';
                        else if (s.ams_status === 263) amsText = '冲刷旧耗材';
                        else if (s.ams_status === 262) amsText = '咬入耗材丝';
                        else if (s.ams_status === 260) amsText = '抽回耗材丝';
                        else if (s.ams_status === 259) amsText = '切断耗材丝';
                        else if (s.ams_status === 258) amsText = '加热喷嘴';
                        else if (s.ams_status === 0) amsText = '空闲';
                        else amsText = String(s.ams_status);

                        el.innerHTML =
                            '<div style="margin-bottom:6px;">MQTT: ' + badge +
                            '  <span style="font-size:12px;color:#888;margin-left:8px;">数据更新: ' + formatTime(s.last_update) + '</span></div>' +
                            '<div class="task-name">任务: ' + (s.subtask || '--') + '</div>' +
                            '<div class="status-grid">' +
                            '  <div class="status-item"><div class="label">状态</div><div class="value">' + s.state + '</div></div>' +
                            '  <div class="status-item"><div class="label">热床</div><div class="value">' + s.bed + '/' + s.bed_target + '</div></div>' +
                            '  <div class="status-item"><div class="label">喷嘴</div><div class="value">' + s.nozzle + '/' + s.nozzle_target + '</div></div>' +
                            '  <div class="status-item"><div class="label">挤出机</div><div class="value"><span class="badge ' + filaClass + '">' + filaText + '</span></div></div>' +
                            '  <div class="status-item"><div class="label">AMS</div><div class="value">' + amsText + '</div></div>' +
                            '</div>';
                    } catch (e) {
                        el.innerHTML = '<div class="loading">渲染失败: ' + e.message + '</div>';
                    }
                })
                .catch(e => {
                    if (!window._lastStatus) {
                        document.getElementById('status').innerHTML =
                            '<div class="loading">等待 MQTT 连接... (' + e.message + ')</div>';
                    }
                });
        }

        function renderChannels() {
            const el = document.getElementById('channels');
            if (!channelsData.length) {
                el.innerHTML = '<div class="loading">无通道数据</div>';
                return;
            }
            el.innerHTML = '';

            const anyBusy = channelsData.some(c => c.state === 1 || c.state === 2);
            const disabled = anyBusy ? 'disabled' : '';

            channelsData.forEach(ch => {
                const isActive = (ch.id === currentCh);
                const enabled = ch.enabled === true;
                const disabled = anyBusy || !enabled ? 'disabled' : '';
                let stateText = '', stateClass = 'ch-state';
                if (ch.state === 1) stateText = '进料中';
                else if (ch.state === 2) stateText = '退料中';
                else if (ch.state === 3) { stateText = '使用中'; stateClass = 'ch-current'; }

                let options = '';
                MATERIALS.forEach(m => {
                    options += '<option value="' + m + '"' +
                               (ch.material === m ? ' selected' : '') + '>' + m + '</option>';
                });

                const color = ch.color || '#ffffff';
                const enableControl = (ch.id === 7 || ch.id === 8)
                    ? '<label class="channel-enable"><input type="checkbox" ' +
                      (enabled ? 'checked ' : '') + (anyBusy ? 'disabled ' : '') +
                      'onchange="setChannelEnabled(' + ch.id + ', this.checked)"><span>' +
                      (enabled ? '打开' : '关闭') + '</span></label>'
                    : '';

                const div = document.createElement('div');
                div.className = 'channel' + (isActive ? ' active' : '') + (!enabled ? ' disabled' : '');
                div.innerHTML =
                    '<div class="ch-row1">' +
                    '  <span class="ch-title">通道 ' + ch.id + '</span>' +
                    enableControl +
                    '  <select class="mat-select" id="mat_' + ch.id + '" onchange="saveMaterial(' + ch.id + ')" ' +
                    '          onfocus="userInteracting=true" onblur="userInteracting=false" ' + disabled + '>' +
                           options +
                    '  </select>' +
                    '  <div class="color-picker" id="color_' + ch.id + '" ' +
                    '       style="background:' + color + ';" ' +
                    '       onclick="openColorPicker(' + ch.id + ')"></div>' +
                    '  <span class="time-label">进料</span>' +
                    '  <input class="time-input" type="number" id="lt_' + ch.id + '" value="' + (ch.load_time / 1000) + '" ' +
                    '         onfocus="userInteracting=true" onblur="userInteracting=false;saveTime(' + ch.id + ',\'load\')\" ' + disabled + '>' +
                    '  <span class="time-label">退料</span>' +
                    '  <input class="time-input" type="number" id="ut_' + ch.id + '" value="' + (ch.uload_time / 1000) + '" ' +
                    '         onfocus="userInteracting=true" onblur="userInteracting=false;saveTime(' + ch.id + ',\'uload\')\" ' + disabled + '>' +
                    '  <button class="rev-btn" id="revbtn_' + ch.id + '" ' +
                    '          onclick="toggleReverse(' + ch.id + ')" ' +
                    '          title="方向切换（进料/退料 GPIO 交换）" ' + disabled + '>' +
                    (ch.reverse ? '🔄 反向' : '➡️ 正向') +
                    '  </button>' +
                    (stateText ? '  <span class="' + stateClass + '">' + stateText + '</span>' : '') +
                    '</div>' +
                    '<div class="ch-row2">' +
                    '  <button class="ch-btn forward" onclick="doAction(' + ch.id + ',\'forward\')" ' + disabled + '>进料</button>' +
                    '  <button class="ch-btn backward" onclick="doAction(' + ch.id + ',\'backward\')" ' + disabled + '>退料</button>' +
                    '  <button class="ch-btn load" onclick="doAction(' + ch.id + ',\'load\')" ' + disabled + '>装载</button>' +
                    '</div>';
                el.appendChild(div);
            });

            if (!channelsData.some(c => c.state === 1 || c.state === 2)) {
                actionPending = false;
            }
        }

        function loadChannels() {
            if (userInteracting) return;

            fetch('/filament', { cache: 'no-store' })
                .then(r => r.json())
                .then(data => {
                    channelsData = data.channels;
                    currentCh = data.current;

                    // 更新模式按钮状态
                    currentMode = data.printer_sync ? 'active' : 'passive';
                    updateModeUI();

                    if (!slowFeedLoaded) {
                        const sp = document.getElementById('slowPulse');
                        const sg = document.getElementById('slowGap');
                        if (sp) sp.value = data.slow_pulse || 30;
                        if (sg) sg.value = data.slow_gap || 600;
                        const be = document.getElementById('bufEnabled');
                        const bet = document.getElementById('bufEnabledText');
                        const bp = document.getElementById('bufPolarity');
                        const bea = document.getElementById('bufEncoderA');
                        const beb = document.getElementById('bufEncoderB');
                        const ber = document.getElementById('bufEncoderReverse');
                        if (be) be.checked = !!data.buffer_enabled;
                        if (bet) bet.textContent = data.buffer_enabled ? '打开' : '关闭';
                        bufferActiveHigh = !!data.buffer_active_high;
                        if (bp) bp.textContent = bufferActiveHigh ? '切换为低有效' : '切换为高有效';
                        if (bea) bea.value = data.buffer_encoder_a >= 0 ? data.buffer_encoder_a : '';
                        if (beb) beb.value = data.buffer_encoder_b >= 0 ? data.buffer_encoder_b : '';
                        if (ber) ber.checked = !!data.buffer_encoder_reverse;
                        const ft = document.getElementById('feedTimeout');
                        if (ft) ft.value = Math.round((data.feed_timeout || 180000) / 1000);
                        const uw = document.getElementById('uloadWait');
                        if (uw && !uw.dataset.loaded) {
                            uw.value = Math.round((data.uload_wait_timeout || 15000) / 1000);
                            uw.dataset.loaded = '1';
                        }
                        slowFeedLoaded = true;
                    }
                    /* 微动辅助送料实时状态（每秒刷新，用于判断接线 / 极性是否正确） */
                    const bst = document.getElementById('bufStatus');
                    if (bst) {
                        const lvl = data.buffer_level;
                        /* ★ 只显示「当前状态:高/低」+ 有效/送料中/变化次数；不再显示「上下拉」 */
                        const parts = ['当前状态:' + (lvl === 1 ? '高' : (lvl === 0 ? '低' : '?'))];
                        if (!data.buffer_enabled) {
                            parts.push('已关闭');
                        } else {
                            parts.push(data.buffer_valid ? '有效' : '无效');
                            parts.push(data.buffer_feeding ? '送料中' : '待机');
                            if (!data.buffer_ready) parts.push('通道未就绪');
                            /* ★ 仅打印机 RUNNING（打印中）时才送料 */
                            if (!data.printer_running) parts.push('打印机未运行');
                        }
                        parts.push('变化:' + (data.buffer_level_changes | 0) + '次');
                        bst.textContent = parts.join(' · ');
                        bst.style.color = (data.buffer_enabled && data.buffer_valid &&
                                           data.printer_running) ? '#28a745' : '#888';
                        bst.title = '微动 GPIO' + (data.buffer_gpio !== undefined ? data.buffer_gpio : 7) +
                            ' · 当前通道进料 GPIO ' + data.buffer_channel_gpio +
                            ' · 仅打印机 RUNNING（打印中）且微动电平有效时才送料' +
                            ' · 按住开关时「当前状态」应变化、「变化:」次数应增加；有效=缓慢送料，无效立即停止';
                    }

                    /* 与设备实际「使能 / 有效电平」保持同步，避免界面与实际不一致 */
                    if (Date.now() - bufTouchedAt > 3000) {
                        const be2 = document.getElementById('bufEnabled');
                        const bet2 = document.getElementById('bufEnabledText');
                        const bp2 = document.getElementById('bufPolarity');
                        if (be2) be2.checked = !!data.buffer_enabled;
                        if (bet2) bet2.textContent = data.buffer_enabled ? '打开' : '关闭';
                        bufferActiveHigh = !!data.buffer_active_high;
                        if (bp2) bp2.textContent = bufferActiveHigh ? '切换为低有效' : '切换为高有效';
                    }
                    renderChannels();
                })
                .catch(() => {});
        }

        function setChannelEnabled(ch, enabled) {
            userInteracting = true;
            fetch('/filament/channel/enable', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'ch=' + ch + '&enabled=' + (enabled ? '1' : '0')
            })
            .then(r => r.json())
            .then(res => showToast(res.ok ? ('通道 ' + ch + (enabled ? ' 已打开' : ' 已关闭')) : '通道忙，无法切换'))
            .catch(() => showToast('网络错误'))
            .finally(() => {
                userInteracting = false;
                loadChannels();
            });
        }

        function updateModeUI() {
            const btn = document.getElementById('modeBtn');
            const hint = document.getElementById('modeHint');
            if (!btn || !hint) return;
            if (currentMode === 'active') {
                btn.textContent = '主动模式';
                btn.classList.add('active');
                hint.textContent = '需仅局域网+开发者模式';
            } else {
                btn.textContent = '被动模式';
                btn.classList.remove('active');
                hint.textContent = '';
            }
        }

        function toggleMode() {
            const newMode = (currentMode === 'active') ? 'passive' : 'active';
            const sync = (newMode === 'active') ? 1 : 0;

            fetch('/filament/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'sync=' + sync
            })
            .then(r => r.json())
            .then(res => {
                if (res.ok) {
                    currentMode = newMode;
                    updateModeUI();
                    showToast('已切换到 ' + (newMode === 'active' ? '主动模式' : '被动模式'));
                } else {
                    showToast('切换失败');
                }
            })
            .catch(() => showToast('网络错误'));
        }

        function saveTime(ch, type) {
            const el = document.getElementById(type === 'load' ? 'lt_' + ch : 'ut_' + ch);
            if (!el) return;
            fetch('/filament/time', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'ch=' + ch + '&type=' + type + '&time=' + Math.round((parseFloat(el.value) || 0) * 1000)
            }).catch(() => {});
        }

        function saveMaterial(ch) {
            const mat = document.getElementById('mat_' + ch).value;
            const chData = channelsData.find(c => c.id === ch);
            if (chData) chData.material = mat;

            fetch('/filament/material', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'ch=' + ch + '&material=' + encodeURIComponent(mat)
            })
            .then(r => r.json())
            .then(res => {
                if (res.ok) showToast('通道 ' + ch + ' 耗材: ' + mat);
                else showToast('保存失败');
            })
            .catch(() => showToast('网络错误'));
        }

        function testSlowFeed() {
            const pulse = document.getElementById('slowPulse').value;
            const gap = document.getElementById('slowGap').value;
            const ch = currentCh || 1;

            showToast('测试中：通道 ' + ch + ' 运行 3 秒');

            fetch('/filament/slow/test', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'ch=' + ch + '&pulse=' + pulse + '&gap=' + gap + '&duration=3'
            })
            .then(r => r.json())
            .then(res => { if (!res.ok) showToast('测试失败'); })
            .catch(() => showToast('网络错误'));
        }

        function scheduleSlowFeedSave() {
            clearTimeout(slowFeedSaveTimer);
            slowFeedSaveTimer = setTimeout(saveSlowFeed, 800);
        }

        function saveSlowFeed() {
            const pulse = document.getElementById('slowPulse').value;
            const gap = document.getElementById('slowGap').value;
            slowFeedLoaded = true;
            fetch('/filament/slow', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'pulse=' + pulse + '&gap=' + gap
            })
            .then(r => r.json())
            .then(res => {
                if (res.ok) showToast('缓慢进料: 脉冲 ' + pulse + 'ms, 间隔 ' + gap + 'ms（已生效）');
                else showToast('保存失败');
            })
            .catch(() => showToast('网络错误'));
        }

        function saveUloadWait() {
            const el = document.getElementById('uloadWait');
            if (!el) return;
            const sec = parseInt(el.value) || 15;
            if (sec < 1 || sec > 120) {
                showToast('退料超时必须在 1-120 秒之间');
                return;
            }
            const ms = sec * 1000;
            fetch('/filament/uload_wait', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'timeout=' + ms
            })
            .then(r => r.json())
            .then(res => {
                if (res.ok) showToast('退料超时: ' + sec + ' 秒');
                else showToast('保存失败');
            })
            .catch(() => showToast('网络错误'));
        }

        function saveFeedTimeout() {
            const ft = document.getElementById('feedTimeout');
            if (!ft) return;
            const timeout_sec = parseInt(ft.value) || 180;
            if (timeout_sec <= 0 || timeout_sec > 600) {
                showToast('超时必须在 1-600 秒之间');
                return;
            }
            const timeout_ms = timeout_sec * 1000;
            fetch('/filament/timeout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'timeout=' + timeout_ms
            })
            .then(r => r.json())
            .then(res => {
                if (res.ok) showToast('送料超时: ' + timeout_sec + ' 秒');
                else showToast('保存失败');
            })
            .catch(() => showToast('网络错误'));
        }

        function saveBuffer() {
            bufTouchedAt = Date.now();
            const enabled = document.getElementById('bufEnabled').checked ? '1' : '0';
            const encoderA = document.getElementById('bufEncoderA').value || '-1';
            const encoderB = document.getElementById('bufEncoderB').value || '-1';
            const encoderReverse = document.getElementById('bufEncoderReverse').checked ? '1' : '0';

            fetch('/filament/buffer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'enabled=' + enabled + '&active_high=' + (bufferActiveHigh ? '1' : '0') +
                    '&encoder_a=' + encoderA + '&encoder_b=' + encoderB +
                    '&encoder_reverse=' + encoderReverse
            })
            .then(r => r.json())
            .then(res => {
                if (res.ok) {
                    const enabledText = document.getElementById('bufEnabledText');
                    if (enabledText) enabledText.textContent = enabled === '1' ? '打开' : '关闭';
                    showToast('微动辅助送料已生效：' + (enabled === '1' ? '使能打开' : '使能关闭') +
                        '，' + (bufferActiveHigh ? '高有效' : '低有效'));
                }
                else showToast('保存失败（设备未接受）');
            })
            .catch(() => showToast('网络错误'));
        }

        function toggleBufferPolarity() {
            bufferActiveHigh = !bufferActiveHigh;
            const button = document.getElementById('bufPolarity');
            if (button) button.textContent = bufferActiveHigh ? '切换为低有效' : '切换为高有效';
            saveBuffer();
        }

        function doAction(ch, action) {
            if (actionPending) return;
            actionPending = true;
            saveTime(ch, 'load');
            saveTime(ch, 'uload');

            document.querySelectorAll('#channels .ch-btn').forEach(b => b.disabled = true);
            document.querySelectorAll('#channels input').forEach(i => i.disabled = true);
            document.querySelectorAll('#channels select').forEach(s => s.disabled = true);

            saveTime(ch, 'load');
            saveTime(ch, 'uload');

            fetch('/filament/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'ch=' + ch + '&action=' + action
            })
            .then(r => r.json())
            .then(res => {
                if (res.ok) {
                    let msg = '';
                    if (action === 'forward') msg = '通道 ' + ch + ' 进料中...';
                    else if (action === 'backward') msg = '通道 ' + ch + ' 退料中...';
                    else if (action === 'load') msg = '通道 ' + ch + ' 装载中...';
                    showToast(msg);
                    setTimeout(loadChannels, 500);
                } else {
                    showToast('操作失败');
                    actionPending = false;
                    loadChannels();
                }
            })
            .catch(() => {
                showToast('网络错误');
                actionPending = false;
                loadChannels();
            });
        }

        function loadLogs() {
            fetch('/logs?since=' + logReceived, { cache: 'no-store' })
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(data => {
                    const panel = document.getElementById('logPanel');
                    if (!panel) return;

                    if (data.logs && data.logs.length > 0) {
                        data.logs.forEach(line => {
                            let clean = line.replace(/\n+$/, '');
                            panel.textContent += clean + '\n';
                        });
                        logReceived += data.logs.length;
                        panel.scrollTop = panel.scrollHeight;

                        const lines = panel.textContent.split('\n');
                        if (lines.length > 200) {
                            panel.textContent = lines.slice(-200).join('\n');
                        }
                    }
                })
                .catch(e => console.warn('/logs 失败:', e));
        }

        function clearLogs() {
            document.getElementById('logPanel').textContent = '';
            logReceived = 0;
        }

        function saveLogs() {
            const panel = document.getElementById('logPanel');
            if (!panel) return;

            const content = panel.textContent;
            if (!content || content.trim() === '') {
                showToast('日志为空');
                return;
            }

            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const filename = 'logs_' +
                now.getFullYear() +
                pad(now.getMonth() + 1) +
                pad(now.getDate()) + '_' +
                pad(now.getHours()) +
                pad(now.getMinutes()) +
                pad(now.getSeconds()) + '.log';

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => URL.revokeObjectURL(url), 1000);

            showToast('已保存: ' + filename);
        }

        function rebootDevice() {
            if (!confirm("确定要重启设备吗？")) return;
            showToast("正在重启设备...");
            fetch("/reboot", { method: "POST" })
                .then(r => r.json())
                .then(res => {
                    if (res.ok) {
                        showToast("设备将在 3 秒后重启");
                    } else {
                        showToast("重启失败");
                    }
                })
                .catch(() => {
                    // 设备重启后连接会断，catch 正常
                    showToast("设备正在重启...");
                });
        }

        function toggleReverse(ch) {
            const chData = channelsData.find(c => c.id === ch);
            if (!chData) return;
            const newRev = !chData.reverse;
            fetch('/filament/reverse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'ch=' + ch + '&reverse=' + (newRev ? '1' : '0')
            })
            .then(r => r.json())
            .then(res => {
                if (res.ok) {
                    chData.reverse = newRev;
                    const btn = document.getElementById('revbtn_' + ch);
                    if (btn) {
                        btn.textContent = newRev ? '🔄 反向' : '➡️ 正向';
                        btn.classList.toggle('reversed', newRev);
                    }
                    showToast('通道 ' + ch + ' 方向: ' + (newRev ? '反向' : '正向'));
                } else {
                    showToast('切换失败');
                }
            })
            .catch(() => showToast('网络错误'));
        }

        function openColorPicker(ch) {
            currentColorCh = ch;
            const chData = channelsData.find(c => c.id === ch);
            if (!chData) return;

            const preset = document.getElementById('presetColors');
            preset.innerHTML = '';
            PRESET_COLORS.forEach(c => {
                const div = document.createElement('div');
                div.style.cssText = 'width:100%; padding-bottom:100%; background:' + c +
                                    '; border-radius:4px; cursor:pointer; border:2px solid ' +
                                    (chData.color === c ? '#007bff' : '#ddd') + ';';
                div.onclick = () => {
                    document.getElementById('customColor').value = c;
                };
                preset.appendChild(div);
            });

            document.getElementById('customColor').value = chData.color || '#ffffff';
            document.getElementById('colorModal').style.display = 'flex';
        }

        function closeColorPicker() {
            document.getElementById('colorModal').style.display = 'none';
        }

        function confirmColor() {
            const color = document.getElementById('customColor').value;
            const ch = currentColorCh;

            const chData = channelsData.find(c => c.id === ch);
            if (chData) chData.color = color;

            const el = document.getElementById('color_' + ch);
            if (el) el.style.background = color;

            fetch('/filament/color', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'ch=' + ch + '&color=' + encodeURIComponent(color)
            })
            .then(r => r.json())
            .then(res => {
                if (res.ok) showToast('通道 ' + ch + ' 颜色已更新');
                else showToast('保存失败');
            })
            .catch(() => showToast('网络错误'));

            closeColorPicker();
        }

        window.addEventListener('load', function() {
            const ftInput = document.getElementById('feedTimeout');
            if (ftInput) {
                ftInput.addEventListener('input', () => {
                    clearTimeout(ftTimer);
                    ftTimer = setTimeout(saveFeedTimeout, 500);
                });
            }

            loadSavedConfig();
            refreshStatus();
            loadChannels();
            loadLogs();
            setInterval(loadSavedConfig, 15000);
            setInterval(refreshStatus, 1000);
            setInterval(loadChannels, 1000);
            setInterval(loadLogs, 1000);
        });
    </script>
</body>
</html>
